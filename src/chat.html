<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartly — Support Chat</title>
    <meta name="description" content="Autonomous Customer Support Resolution Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/global.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  </head>
  <body>
    <!-- Animated background orbs -->
    <div class="orb orb-purple"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-magenta"></div>

    <div class="chat-layout">
      <!-- Sidebar / User Profile -->
      <aside class="chat-sidebar glass-card">
        <div class="chat-header">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 22h5l5-10 5 10h5L12 2z" fill="url(#logo-grad)"/>
            <defs>
              <linearGradient id="logo-grad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
          </svg>
          <h2>CARTLY</h2>
        </div>

        <div class="chat-sessions-header" style="display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; margin-bottom: 0.5rem;">
          <h3 style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin: 0;">Sessions</h3>
          <button id="btn-new-chat" style="background: transparent; border: none; color: #38bdf8; cursor: pointer; display: flex; align-items: center; padding: 0.25rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <div class="chat-sessions" id="sessions-list" style="overflow-y: auto; max-height: 50vh;">
          <div class="session-item active" id="default-session-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Current Session
          </div>
        </div>

        <div class="chat-user-profile" style="margin-top: auto;">
          <div class="avatar" id="user-avatar">?</div>
          <div class="user-info">
            <div class="user-name" id="user-name">Loading...</div>
            <div class="user-email" id="user-email">...</div>
          </div>
          <button class="btn-logout" id="btn-logout" title="Log Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="chat-main">
        <div class="chat-topbar">
          <h2>Customer Support</h2>
        </div>
        
        <div class="chat-messages" id="chat-history">
          <!-- Messages will be injected here by JS -->
        </div>

        <div class="chat-input-area">
          <form id="chat-form" class="chat-input-wrapper">
            <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" />
            <button type="submit" class="btn-send-msg" id="btn-send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script type="module" src="/scripts/chat.js"></script>
  </body>
</html>
